# Fan profiles with FanControl
#
# One fan profile while a game runs, another the rest of the time.
# Full instructions: see README.md next to this file.
#
# Before this works you need two scheduled tasks, registered once with
# "run with highest privileges":
#
#   GameModeExecutor\FanControl Game   ->  FanControl.exe -c <your gaming configuration>.json
#   GameModeExecutor\FanControl Idle   ->  FanControl.exe -c <your everyday configuration>.json
#
# The task names are fixed. Which FanControl configuration each one applies is
# chosen when the tasks are registered and lives in the task, so this file is
# the same for everyone and never has to know what you called yours.
#
# The backslash is a Task Scheduler folder, not a path on disk: everything this
# program installs lives under \GameModeExecutor rather than loose at the root.
# Note the single quotes -- TOML takes those literally, so the backslash needs
# no doubling.
#
# The detour exists because FanControl requires administrator rights and this
# watcher deliberately has none. Triggering a task needs no rights at all.
#
# Notice there is no path to FanControl in this file. It lives in the task
# instead, which is what keeps this file editable by a non-administrator.

[general]
# Apply the idle configuration if the watcher stops while a game is running. After
# a logoff or shutdown that happens at the next logon instead.
stop_actions_on_exit = true

# "debug" adds the detail behind each line: which process was matched, and how
# long Windows took to release its "a game is running" signal.
log_level = "info"

[on_game_start]
mode = "series"

[[on_game_start.actions]]
name = "FanControl - Game"
program = "schtasks.exe"
args = ["/Run", "/TN", 'GameModeExecutor\FanControl Game']
# Wait for the trigger to be accepted, so the log records whether it was.
# schtasks returns in about 100 ms; the timeout is only a safety net.
wait = true
timeout = "15s"

[on_game_stop]
mode = "series"

[[on_game_stop.actions]]
name = "FanControl - Idle"
program = "schtasks.exe"
args = ["/Run", "/TN", 'GameModeExecutor\FanControl Idle']
wait = true
timeout = "15s"
