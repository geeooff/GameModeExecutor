# Writing your own — every option in one place
#
# This is a working file: every command in it is harmless, so you can copy it
# and delete what you do not want. Full explanations: README.md next to it.

[general]
# Run the stop commands if the watcher itself is stopped while a game is
# running, so logging off does not leave a gaming profile applied.
stop_actions_on_exit = true

# error | warn | info | debug | trace
#
# "info" tells the story: a game detected, named, gone. "debug" annotates every
# one of those lines with process ids and paths, and adds the reasoning -- when
# Windows released its signal, why a name was or was not refined.
log_level = "info"

# Where the log goes. Defaults to %APPDATA%\GameModeExecutor\logs.
#log_dir = 'C:\Users\me\AppData\Roaming\GameModeExecutor\logs'

[detection]
# Every key here has a sensible default; the whole block can be left out.

# How often to look for a game while none is running. This is the only polling
# the program does: once a game starts it waits on Windows' own signal and does
# nothing at all until that ends.
poll_interval = "2s"

# After the signal drops, how long to wait for it to come back before running
# the stop commands. Guards against a game that briefly makes Windows
# re-activate it mid-session.
stop_delay = "2s"

# A title brings several processes that all match Windows' list of known games:
# a launcher, an anti-cheat service, the game. The satellites usually start
# first, so the name captured at the very start is often the wrong one. Once,
# this far into a session, the per-process GPU counters decide which one is
# really drawing. "0s" skips it and keeps whatever matched first.
identify_after = "20s"

# GPU load is a rate, so it needs two readings this far apart.
gpu_sample = "1s"

# ---------------------------------------------------------------------------
# Commands
#
#   mode = "series"    each command runs after the previous one finished (default)
#   mode = "parallel"  all started at once, then waited for
#
# A command that fails to start is logged and never stops the others.
#
# Placeholders, substituted in program, args, working_dir and env:
#   {event}         game_start or game_stop
#   {process_name}  e.g. bf6.exe
#   {process_id}    e.g. 14552
#   {process_path}  full path, when readable
#
# They are filled from the list of titles Windows keeps, and are best effort:
# a game Windows tracks but does not describe leaves them empty. Detection
# never depends on them.
# ---------------------------------------------------------------------------

[on_game_start]
mode = "series"

# The minimum: a program and its arguments.
[[on_game_start.actions]]
name = "say which game started"
program = "powershell.exe"
args = ["-NoProfile", "-Command", "Write-Host 'playing {process_name}'"]

# Everything a command accepts, spelled out.
[[on_game_start.actions]]
name = "label used in the log"
program = "cmd.exe"
args = ["/c", "echo", "{event}"]
working_dir = 'C:\Windows'
env = { MY_VARIABLE = "value", GAME = "{process_name}" }
no_window = true      # hide the command's own console window (default true)
wait = true           # wait for it to finish before the next one
timeout = "15s"       # give up waiting after this long; ignored unless `wait`
enabled = true        # set false to keep it here without running it

[on_game_stop]
mode = "series"

# On game_stop the process id is deliberately empty: by then that process is
# usually long gone, and claiming otherwise would be a lie. The name is the one
# captured when the session started.
[[on_game_stop.actions]]
name = "say the session ended"
program = "powershell.exe"
args = ["-NoProfile", "-Command", "Write-Host 'stopped playing {process_name}'"]
