[package]
name = "game-mode-executor"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Detects when a game is running on Windows and runs configured executables on start/stop (e.g. switch FanControl profiles)."
license = "MIT"
repository = "https://github.com/Geeooff/GameModeExecutor"
readme = "README.md"
keywords = ["windows", "gaming", "automation", "fancontrol"]
categories = ["command-line-utilities"]

[[bin]]
name = "gamemode-executor"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
humantime-serde = "1"
serde = { version = "1", features = ["derive"] }
toml = "1"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
