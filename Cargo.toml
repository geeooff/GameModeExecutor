[package]
name = "game-mode-executor"
version = "0.2.0"
authors = ["Geoffrey Vancoetsem"]
edition = "2024"
# Let chains, stable since 1.88.
rust-version = "1.88"
description = "Runs the executables you configure when a game starts and stops on Windows, using Windows' own game signal rather than a list of games."
license = "MIT"
repository = "https://github.com/Geeooff/GameModeExecutor"
readme = "README.md"
keywords = ["windows", "gaming", "automation"]
categories = ["command-line-utilities"]
# An application, not a library: never meant for crates.io.
publish = false

[[bin]]
name = "gamemode-executor"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
humantime = "2"
humantime-serde = "1"
serde = { version = "1", features = ["derive"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(windows)'.dependencies]
# Microsoft's own bindings, and nothing else for Win32. Every feature below is
# used; `cargo build` is the check, since a function is only generated when
# all the features its signature needs are on.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    # CreateEventW and CreateMutexW take SECURITY_ATTRIBUTES, even as None.
    "Win32_Security",
    "Win32_Storage_Packaging_Appx",
    # MsiEnumRelatedProducts: whether the installer owns the executables, which
    # decides how `purge` removes them.
    "Win32_System_ApplicationInstallationAndServicing",
    # The updater: WinHTTP for the release, CNG for the SHA-256 of what it
    # fetched. Microsoft's libraries, no HTTP or hashing crate.
    "Win32_Networking_WinHttp",
    "Win32_Security_Cryptography",
    # FindFirstChangeNotificationW: the configuration folder, watched for the
    # live reload.
    "Win32_Storage_FileSystem",
    # RegNotifyChangeKeyValue: Windows' game list, watched rather than polled.
    "Win32_System_Registry",
    # WNDCLASSEXW names HBRUSH, HICON and HCURSOR, so the window class needs Gdi
    # even though this program never draws anything.
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    # Without this the process is DPI-unaware, GetSystemMetrics answers with the
    # 96 dpi value, and the notification icon is built at 16 px then stretched
    # to whatever the taskbar actually wants.
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Diagnostics_ToolHelp",
    # K32EnumProcesses: the process ids alone, measured against the Toolhelp
    # snapshot as the idle poll's cost (the probe's `cost`).
    "Win32_System_ProcessStatus",
    "Win32_System_Performance",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_WinRT",
] }
# The safe registry wrapper from the same project.
windows-registry = "0.6"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
# Abort rather than unwind: the panic hook logs FATAL synchronously and the
# process ends. Nothing in this program can recover from a panic usefully.
panic = "abort"
strip = true

[lints.clippy]
# Every unsafe block says why it is sound. FFI into Win32 is most of this
# program, and "it compiles" is not an argument there.
undocumented_unsafe_blocks = "deny"
