# GameModeExecutor - example configuration
#
# Copy this file next to gamemode-executor.exe as `config.toml`,
# or run `gamemode-executor init` to drop it in %APPDATA%\GameModeExecutor.

[general]
# How often the detectors are polled.
poll_interval = "2s"
# A game must be detected continuously for this long before on_game_start runs.
start_delay = "5s"
# No game must be detected for this long before on_game_stop runs.
stop_delay = "15s"
# Run on_game_stop when the watcher itself exits while a game is active.
stop_actions_on_exit = true
# error | warn | info | debug | trace  (the RUST_LOG env var overrides this)
log_level = "info"
# Rolling daily log files (absolute path). When left unset, a hidden instance
# logs to %APPDATA%\GameModeExecutor\logs and a console instance only
# logs to the console.
#log_dir = 'C:\Users\me\AppData\Roaming\GameModeExecutor\logs'
log_keep_days = 7

[detection]
[detection.fullscreen]
# Uses the Windows shell notification state: catches any full-screen app.
# Interim detector while the Game Bar presence writer route is being validated.
enabled = true
# d3d_exclusive : exclusive full-screen Direct3D (QUNS_RUNNING_D3D_FULL_SCREEN)
# busy          : a full-screen / borderless app is running (QUNS_BUSY)
# store_app     : a Store app is full-screen (QUNS_APP)
# presentation  : presentation mode is on (QUNS_PRESENTATION_MODE)
states = ["d3d_exclusive", "busy"]

# ---------------------------------------------------------------------------
# Actions. Each entry starts one executable.
#
# Placeholders usable in program, args, working_dir and env values:
#   {event}         game_start | game_stop
#   {process_name}  e.g. cs2.exe
#   {process_id}    e.g. 12345
#   {process_path}  full path, when readable
# ---------------------------------------------------------------------------

[[on_game_start]]
name = "FanControl - gaming profile"
program = 'C:\Program Files (x86)\FanControl\FanControl.exe'
args = ["-c", "gaming.json"]
no_window = true
wait = false

[[on_game_stop]]
name = "FanControl - silent profile"
program = 'C:\Program Files (x86)\FanControl\FanControl.exe'
args = ["-c", "silent.json"]
no_window = true
wait = false

