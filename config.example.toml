# GameModeExecutor - example configuration
#
# Copy this file next to gamemode-executor.exe as `config.toml`,
# or run `gamemode-executor init` to drop it in %APPDATA%\GameModeExecutor.
#
# There is no list of games to maintain here. Detection is Windows' own:
# the program watches the Game Bar presence writer, which Windows starts for
# a game and releases when it is gone.

[general]
# Run on_game_stop when the watcher itself exits while a game is running.
stop_actions_on_exit = true
# error | warn | info | debug | trace  (the RUST_LOG env var overrides this)
log_level = "info"
# Where the log file goes (absolute path). Defaults to
# %APPDATA%\GameModeExecutor\logs. Timestamps are in local time.
#log_dir = 'C:\Users\me\AppData\Roaming\GameModeExecutor\logs'

[detection]
# How often to look for the presence writer while no game is running. This is
# the only polling the program does: once a game starts, it parks on the
# writer's process handle and does nothing until Windows releases it.
poll_interval = "2s"
# After the writer exits, how long to wait for it to come back before running
# the stop actions. Guards against a game that briefly makes Windows
# re-activate it. Set to "0s" to react immediately.
stop_delay = "5s"

# ---------------------------------------------------------------------------
# Actions. Each entry starts one executable.
#
# Placeholders usable in program, args, working_dir and env values:
#   {event}         game_start | game_stop
#   {process_name}  e.g. FarmingSimulator2025Game.exe
#   {process_id}    e.g. 12345
#   {process_path}  full path, when readable
#
# The placeholders are filled from Windows' known game list. They can come out
# empty for a title Windows tracks but does not describe: detection still
# works, only the naming is missing.
# ---------------------------------------------------------------------------

# FanControl requires administrator elevation, so it cannot be started
# directly by this unelevated watcher (error 740). Go through a scheduled task
# registered once with "run with highest privileges" - see the README section
# "Programs that require elevation".

[[on_game_start]]
name = "FanControl - Game profile"
program = "schtasks.exe"
args = ["/Run", "/TN", "GameModeExecutor - FanControl Game"]
wait = true
timeout = "15s"

[[on_game_stop]]
name = "FanControl - Quiet profile"
program = "schtasks.exe"
args = ["/Run", "/TN", "GameModeExecutor - FanControl Quiet"]
wait = true
timeout = "15s"

# A program that does not need elevation can be run directly:
# [[on_game_start]]
# name = "power plan - high performance"
# program = "powercfg.exe"
# args = ["/setactive", "SCHEME_MIN"]

# Example of a second action, disabled:
# [[on_game_start]]
# enabled = false
# name = "log the game"
# program = "cmd.exe"
# args = ["/c", "echo {event} {process_name} >> C:\\temp\\games.log"]
# wait = true
# timeout = "10s"
